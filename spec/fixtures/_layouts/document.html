---
layout: default
---

<article class="document">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="document-meta">
      <strong>Date:</strong> {{ page.date | date: "%Y-%m-%d" }}<br>
      <strong>Category:</strong> {{ page.category }}{% include document_metadata_extra.html %}
    </p>
  </header>

  <p>
    <a href="{{ page.file_url | relative_url }}" class="document-download"{% include document_download_attributes.html %}>
      {% document_icon page %}
      Download ({{ page.extension | remove: "." | upcase }})
    </a>
  </p>
</article>
