# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-documents
sonar.projectName=jekyll-documents

sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=coverage/**,vendor/**,node_modules/**

# spec/fixtures intentionally mirrors shipped _includes/_layouts templates;
# exclude it from copy/paste duplication detection.
sonar.cpd.exclusions=spec/fixtures/**

# SimpleCov JSON report emitted by spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# Coverage is instrumented for lib/**/*.rb only; the vendored browser JS has
# no instrumentation, so exclude it from the denominator.
sonar.coverage.exclusions=assets/**,playwright.config.js
