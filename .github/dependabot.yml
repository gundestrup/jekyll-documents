version: 2
updates:
  # Keep bundler dependencies up-to-date
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Group minor and patch updates together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Keep GitHub Actions up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

# NOTE: The Semgrep container image pin in .github/workflows/ci.yml
# (jobs.<id>.container.image) cannot be updated by Dependabot — the
# github-actions ecosystem only covers `uses:` refs and the docker
# ecosystem only scans Dockerfiles (dependabot/dependabot-core#5819).
# Bump it manually when new semgrep releases ship.
