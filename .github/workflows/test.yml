name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['.ruby-version']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26
        cache: npm

    - name: Install PDF extraction tools
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Run Ruby quality suite
      run: bundle exec rake quality

    - name: Install Semgrep
      run: pip3 install semgrep

    - name: Run Semgrep security scan
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      run: semgrep ci

    - name: Audit JavaScript dependencies
      run: npm audit --audit-level=high

    - name: Check for outdated npm packages
      run: npm outdated || true
      continue-on-error: true

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby 3.4
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26
        cache: npm

    - name: Install browser test dependencies
      run: npm ci

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run browser tests
      run: bundle exec rake browser_test

  build:
    runs-on: ubuntu-latest
    needs: [test, browser]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby 3.4
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Build gem
      run: gem build jekyll-documents.gemspec

    - name: Upload gem artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: jekyll-documents-gem
        path: '*.gem'
