name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        ruby-version: ['.ruby-version']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 26
        cache: npm

    - name: Install PDF extraction tools
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

    - name: Install JavaScript dependencies
      run: npm ci --ignore-scripts

    - name: Run Ruby quality suite
      run: bundle exec rake quality

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage/coverage.xml
        use_oidc: true
        fail_ci_if_error: true

    - name: SonarQube Cloud scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Audit JavaScript dependencies
      run: npm run audit

    - name: Check for outdated npm packages
      run: npm outdated || true
      continue-on-error: true

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Semgrep security scan
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      run: semgrep ci

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby (from .ruby-version)
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 26
        cache: npm

    - name: Install browser test dependencies
      run: npm ci --ignore-scripts

    - name: Install Chromium
      run: ./node_modules/.bin/playwright install --with-deps chromium

    - name: Run browser tests
      run: bundle exec rake browser_test

  build:
    runs-on: ubuntu-latest
    needs: [test, browser]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby (from .ruby-version)
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Build gem
      run: gem build jekyll-documents.gemspec

    - name: Upload gem artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: jekyll-documents-gem
        path: '*.gem'
