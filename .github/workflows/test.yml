name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Run Ruby quality suite
      run: bundle exec rake quality

    - name: Audit JavaScript dependencies
      run: npm audit --audit-level=high

    - name: Check for outdated npm packages
      run: npm outdated || true
      continue-on-error: true

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install browser test dependencies
      run: npm ci

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run browser tests
      run: bundle exec rake browser_test

  build:
    runs-on: ubuntu-latest
    needs: [test, browser]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Build gem
      run: gem build jekyll-documents.gemspec

    - name: Upload gem artifact
      uses: actions/upload-artifact@v7
      with:
        name: jekyll-documents-gem
        path: '*.gem'
